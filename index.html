<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Combustível</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-gas-pump"></i>
                <h1>Comparador de Combustível</h1>
            </div>
            <p>Encontre o melhor preço para abastecer o seu veículo</p>
        </header>

        <main>
            <section class="card input-section">
                <h2>Adicionar Preço</h2>
                <form id="price-form">
                    <div class="form-group">
                        <label for="station-name">Nome do Posto</label>
                        <input type="text" id="station-name" placeholder="Ex: Posto Ipiranga Centro" required>
                    </div>
                    <div class="form-row prices-row">
                        <div class="form-group price-input">
                            <label for="price-gascomum">Gasolina Comum</label>
                            <input type="number" id="price-gascomum" step="0.01" min="0.01" placeholder="Ex: 5.49">
                        </div>
                        <div class="form-group price-input">
                            <label for="price-gasaditivada">Gasolina Aditivada</label>
                            <input type="number" id="price-gasaditivada" step="0.01" min="0.01" placeholder="Ex: 5.69">
                        </div>
                        <div class="form-group price-input">
                            <label for="price-etanol">Etanol</label>
                            <input type="number" id="price-etanol" step="0.01" min="0.01" placeholder="Ex: 3.49">
                        </div>
                        <div class="form-group price-input">
                            <label for="price-diesel">Diesel</label>
                            <input type="number" id="price-diesel" step="0.01" min="0.01" placeholder="Ex: 6.10">
                        </div>
                    </div>
                    
                    <div class="form-group map-group">
                        <label>Localização (Cole Link do Maps ou use GPS)</label>
                        <input type="text" id="gmaps-link" placeholder="Cole o link completo do Google Maps aqui..." style="margin-bottom: 0.75rem;">
                        <div class="location-controls">
                            <button type="button" id="get-location-btn" class="btn-secondary btn-small">
                                <i class="fa-solid fa-location-crosshairs"></i> Pegar GPS Automático
                            </button>
                            <span id="location-status" class="status-msg"></span>
                        </div>
                        <div id="picker-map" class="map-container picker-map"></div>
                        <input type="hidden" id="latitude" required>
                        <input type="hidden" id="longitude" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn-primary">
                            <i class="fa-solid fa-plus"></i> <span id="submit-text">Adicionar</span>
                        </button>
                        <button type="button" id="cancel-btn" class="btn-secondary hidden" onclick="window.cancelEdit()">
                            <i class="fa-solid fa-xmark"></i> Cancelar
                        </button>
                    </div>
                </form>
            </section>

            <section class="results-dashboard">
                <div class="filter-group">
                    <label for="filter-fuel">Filtrar por Combustível:</label>
                    <select id="filter-fuel">
                        <option value="Todos">Visão Geral (Todos)</option>
                        <option value="Gasolina Comum">Gasolina Comum</option>
                        <option value="Gasolina Aditivada">Gasolina Aditivada</option>
                        <option value="Etanol">Etanol</option>
                        <option value="Diesel">Diesel</option>
                    </select>
                </div>

                <div class="stats-grid">
                    <div class="stat-card cheapest">
                        <div class="stat-icon"><i class="fa-solid fa-arrow-down-up-across-line"></i></div>
                        <div class="stat-info">
                            <h3>Mais Barato</h3>
                            <p id="cheapest-price" class="value">R$ 0,00</p>
                            <span id="cheapest-station" class="station-name">-</span>
                        </div>
                    </div>
                    <div class="stat-card average">
                        <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
                        <div class="stat-info">
                            <h3>Média de Preço</h3>
                            <p id="average-price" class="value">R$ 0,00</p>
                            <span class="station-name">Baseado nas entradas</span>
                        </div>
                    </div>
                    <div class="stat-card expensive">
                        <div class="stat-icon"><i class="fa-solid fa-arrow-up-right-dots"></i></div>
                        <div class="stat-info">
                            <h3>Mais Caro</h3>
                            <p id="expensive-price" class="value">R$ 0,00</p>
                            <span id="expensive-station" class="station-name">-</span>
                        </div>
                    </div>
                </div>
                
                <div class="card map-section">
                    <h2><i class="fa-solid fa-map-location-dot"></i> Mapa de Postos</h2>
                    <div id="main-map" class="map-container main-map"></div>
                </div>

                <div class="card list-section">
                    <h2>Histórico de Registros</h2>
                    <div class="table-responsive">
                        <table id="stations-table">
                            <thead>
                                <tr>
                                    <th>Posto</th>
                                    <th>Preços Registrados</th>
                                    <th style="text-align: right;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="stations-list">
                                <!-- Items will be dynamically added here -->
                                <tr class="empty-row"><td colspan="4">Nenhum posto registrado ainda.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- Leaflet JS for Maps -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="script.js"></script>
</body>
</html>
